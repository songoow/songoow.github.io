baseURL = "https://songoow.github.io/"
theme = "bearblog"
title = "Song Blog"
author = "Song"
copyright = "Copyright © 2026, Song."
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true

enableRobotsTXT = true

# 保持 BearBlog 风格：用 /:slug/ 简洁 URL，禁用多余 taxonomy
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[permalinks]
  posts = "/:slug/"
  tags = "/posts/:slug"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20

[params]
  description = "Song 的技术与学习博客"
  favicon = ""
  images = []
  dateFormat = "2006-01-02"
  enablePostNavigator = true

[markup]
  [markup.highlight]
    style = "monokai"
    lineNos = true
    lineNumbersInTable = true
    codeFences = true
